# Pipeline de integração contínua, em estágios do mais barato ao mais caro:
#
#   1. commits ──┬─> 2. quality ──┬─> 3. test ─> 4. build ─┬─> 5. e2e
#                ├─> 2. security ─┤                        └─> 5. lighthouse
#                └─> 2. codeql ───┘
#
# Um estágio só roda se os anteriores passaram. O estágio 1 só existe em PRs (verifica os commits
# da branch); em push na main o pipeline começa no estágio 2.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: 1 · Commits e versionamento
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Mensagens dos commits (Commitlint)
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Título do PR (Commitlint, vira o commit do squash)
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

      - name: Tamanho dos commits (máx. 30 arquivos)
        run: node scripts/check-commit-size.js --range "$BASE_SHA..$HEAD_SHA"

      - name: Versão do package.json
        run: node scripts/bump-versions.js --check

      - name: Tipo do título compatível com o bump
        run: node scripts/bump-versions.js --check-title

  quality:
    name: 2 · Qualidade
    needs: commits
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Formatação (Biome)
        run: pnpm format:check

      - name: Lint e code smells (ESLint + SonarJS)
        run: pnpm lint

      - name: Tipos (TypeScript)
        run: pnpm typecheck

  security:
    name: 2 · Segurança
    needs: commits
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Vulnerabilidades conhecidas (pnpm audit)
        run: pnpm audit --audit-level high

      - name: Dependências novas no PR (Dependency Review)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    name: 2 · Segurança (CodeQL)
    needs: commits
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript, actions
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  test:
    name: 3 · Testes unitários
    needs: [quality, security, codeql]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Vitest com cobertura
        run: pnpm test:coverage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: 4 · Build
    needs: test
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build de produção
        run: pnpm build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: 5 · E2E (Playwright)
    needs: build
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Fluxos no navegador sobre o build
        run: pnpm test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: 5 · Lighthouse
    needs: build
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Auditoria com notas mínimas
        run: pnpm lighthouse:ci

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: reports/lighthouse.report.*
          retention-days: 7
