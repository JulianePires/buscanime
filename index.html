<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Buscanime: encontre animes por texto e formato e consulte os detalhes de cada título."
    />
    <title>Buscanime | Busca de animes</title>
    <!-- A lista depende da API e das capas: abre as conexões antes do JS (LCP). O crossorigin
         casa com o fetch CORS do Apollo; sem ele a conexão aberta não é reaproveitada. Aqui, e não
         no preconnect() do React: no cliente ele só roda junto com a requisição (AI_LOG, Decisões). -->
    <link rel="preconnect" href="https://graphql.anilist.co" crossorigin />
    <link rel="preconnect" href="https://s4.anilist.co" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
